name: PR Gate (Policy + Optional Auto-Approval)

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to evaluate'
        required: true
        type: string

permissions:
  checks: read
  contents: read
  issues: write
  pull-requests: write
  statuses: read

jobs:
  gate:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event.pull_request.state == 'open' && github.event.pull_request.draft == false)
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate risk policy and maintain labels
        id: policy
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const { owner, repo } = context.repo;
            let pr = context.payload.pull_request;
            if (context.eventName === "workflow_dispatch") {
              const input = process.env.PR_NUMBER ?? "";
              const pull_number = Number(input);
              if (!/^[1-9][0-9]*$/.test(input) || !Number.isSafeInteger(pull_number)) {
                core.setFailed("Enter a positive integer for the pull request number.");
                return;
              }
              const res = await github.rest.pulls.get({ owner, repo, pull_number });
              pr = res.data;
            }
            if (pr?.state !== "open" || pr.draft !== false) {
              core.info("Skipping policy evaluation because the pull request is closed or a draft.");
              return;
            }
            const issue_number = pr.number;

            const allowedPaths = [
              /^book\//,
              /^blog\//,
              /^_posts\//,
              /^README\.md$/,
              /^SETUP\.md$/,
              /^WORKFLOW_PLAYBOOK\.md$/,
              /^content\.md$/,
              /^index\.md$/,
              /^_config\.yml$/,
            ];

            const blockedPaths = [
              /^\.github\/workflows\//,
              /^\.github\/actions\//,
              /^scripts\//,
            ];

            async function listAllFiles() {
              const files = [];
              let page = 1;
              while (true) {
                const res = await github.rest.pulls.listFiles({
                  owner,
                  repo,
                  pull_number: issue_number,
                  per_page: 100,
                  page,
                });
                files.push(...res.data);
                if (res.data.length < 100) break;
                page += 1;
              }
              return files;
            }

            async function ensureLabel(name, color, description) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (e) {
                if (e.status === 404) {
                  await github.rest.issues.createLabel({ owner, repo, name, color, description });
                } else {
                  throw e;
                }
              }
            }

            async function addLabel(name) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number,
                labels: [name],
              });
            }

            async function removeLabelIfPresent(name) {
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number,
                  name,
                });
              } catch (e) {
                if (e.status !== 404) throw e;
              }
            }

            const files = await listAllFiles();
            const filePaths = files.map((f) => f.filename);
            const changedFiles = pr.changed_files;
            const totalLineDelta = pr.additions + pr.deletions;

            const hasBlockedPath = filePaths.some((p) => blockedPaths.some((r) => r.test(p)));
            const hasOutsideAllowedPath = filePaths.some((p) => !allowedPaths.some((r) => r.test(p)));

            const lowRiskBySize = changedFiles <= 10 && totalLineDelta <= 400;
            const lowRisk = !hasBlockedPath && !hasOutsideAllowedPath && lowRiskBySize;

            await ensureLabel(
              "auto-approve-candidate",
              "0e8a16",
              "Policy gate marked this PR as eligible for optional automated approval."
            );

            if (lowRisk) {
              await addLabel("auto-approve-candidate");
            } else {
              await removeLabelIfPresent("auto-approve-candidate");
            }

            core.setOutput("low_risk", lowRisk ? "true" : "false");
            core.setOutput("pull_number", String(pr.number));
            core.setOutput("head_sha", pr.head.sha);
            core.setOutput("changed_files", String(changedFiles));
            core.setOutput("total_line_delta", String(totalLineDelta));
            core.setOutput("has_blocked_path", hasBlockedPath ? "true" : "false");
            core.setOutput("has_outside_allowed_path", hasOutsideAllowedPath ? "true" : "false");

      - name: Optional bot approval for low-risk PRs
        if: ${{ steps.policy.outputs.low_risk == 'true' }}
        uses: actions/github-script@v8
        env:
          HAS_APPROVER_TOKEN: ${{ secrets.PR_APPROVER_TOKEN != '' }}
          PR_NUMBER: ${{ steps.policy.outputs.pull_number }}
          PR_HEAD_SHA: ${{ steps.policy.outputs.head_sha }}
        with:
          github-token: ${{ secrets.PR_APPROVER_TOKEN || github.token }}
          script: |
            if (process.env.HAS_APPROVER_TOKEN !== "true") {
              core.info("Skipping approval because no approver token is configured.");
              return;
            }
            const { owner, repo } = context.repo;
            const pull_number = Number(process.env.PR_NUMBER);
            const commit_id = process.env.PR_HEAD_SHA;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });
            if (pr.state !== "open" || pr.draft !== false || pr.head.sha !== commit_id) {
              core.info("Skipping approval because the pull request state or head changed after policy evaluation.");
              return;
            }

            const me = await github.rest.users.getAuthenticated();
            const approverLogin = me.data.login;
            const prAuthor = pr.user.login;

            if (approverLogin === prAuthor) {
              core.info(`Skipping approval because approver (${approverLogin}) is the PR author.`);
              return;
            }

            const reviews = await github.rest.pulls.listReviews({
              owner,
              repo,
              pull_number,
              per_page: 100,
            });

            const alreadyApproved = reviews.data.some((r) =>
              r.user && r.user.login === approverLogin && r.state === "APPROVED"
            );

            if (alreadyApproved) {
              core.info(`Approval already exists from ${approverLogin}.`);
              return;
            }

            await github.rest.pulls.createReview({
              owner,
              repo,
              pull_number,
              commit_id,
              event: "APPROVE",
              body: "Auto-approved by PR policy gate (low-risk change set).",
            });

      - name: Write workflow summary
        run: |
          {
            echo "## PR gate decision"
            echo "- low risk: \`${{ steps.policy.outputs.low_risk }}\`"
            echo "- changed files: \`${{ steps.policy.outputs.changed_files }}\`"
            echo "- total line delta: \`${{ steps.policy.outputs.total_line_delta }}\`"
            echo "- has blocked path: \`${{ steps.policy.outputs.has_blocked_path }}\`"
            echo "- has outside allowed path: \`${{ steps.policy.outputs.has_outside_allowed_path }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
